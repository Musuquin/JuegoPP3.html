<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #pong-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
    }
    #pong-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 48px;
      margin-bottom: 12px;
      width: 100%;
    }
    .score-block { text-align: center; }
    .score-label {
      font-size: 12px;
      color: #f4f4ff;
      letter-spacing: 0.08em;
    }
    .score-num {
      font-size: 40px;
      font-weight: 500;
      color: #f4f4ff;
      line-height: 1;
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .score-num.pop {
      transform: scale(1.5);
      color: #bf1eff;
    }
    #pong-canvas {
      border: 1px solid #bf1eff;
      border-radius: 4px;
      display: block;
      background: #000000;
      max-width: 100%;
      transition: box-shadow 0.2s ease;
    }
    #pong-canvas.flash-player { box-shadow: 0 0 32px 6px rgba(191,30,255,0.55); }
    #pong-canvas.flash-ai     { box-shadow: 0 0 32px 6px rgba(255,60,120,0.55); }
    #pong-canvas.shake        { animation: shake 0.35s ease; }
    @keyframes shake {
      0%   { transform: translate(0,0); }
      15%  { transform: translate(-5px, 2px); }
      30%  { transform: translate(5px,-2px); }
      45%  { transform: translate(-4px, 3px); }
      60%  { transform: translate(4px,-1px); }
      75%  { transform: translate(-2px, 1px); }
      100% { transform: translate(0,0); }
    }
    #pong-status {
      margin-top: 10px;
      font-size: 13px;
      color: #bf1eff;
      min-height: 18px;
    }
    #restart-btn {
      margin-top: 14px;
      padding: 8px 24px;
      border: 1px solid #de8cff;
      border-radius: 8px;
      background: transparent;
      color: #bf1eff;
      font-size: 14px;
      cursor: pointer;
      display: none;
    }
    #restart-btn:hover { background: #ff97f6; color: #080810; }
    #canvas-wrap { position: relative; display: inline-block; }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #overlay-text {
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      text-align: center;
    }
    #overlay-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-top: 6px;
    }
    .point-label {
      position: absolute;
      font-size: 22px;
      font-weight: 500;
      pointer-events: none;
      animation: floatUp 1.1s ease forwards;
      white-space: nowrap;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      60%  { opacity: 1; transform: translateY(-38px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-64px) scale(0.9); }
    }

    /* ── Difficulty menu ── */
    #difficulty-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    #difficulty-menu .diff-label {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-right: 4px;
      user-select: none;
    }
    .diff-btn {
      position: relative;
      padding: 5px 16px;
      border-radius: 6px;
      border: 1px solid rgba(191,30,255,0.3);
      background: transparent;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s, background 0.18s, box-shadow 0.18s;
      outline: none;
    }
    .diff-btn:hover {
      border-color: #bf1eff;
      color: #fff;
      background: rgba(191,30,255,0.08);
    }
    .diff-btn.active {
      border-color: #bf1eff;
      color: #bf1eff;
      background: rgba(191,30,255,0.13);
      box-shadow: 0 0 10px 1px rgba(191,30,255,0.25);
    }
    .diff-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #111118;
      border: 1px solid rgba(191,30,255,0.4);
      color: rgba(255,255,255,0.82);
      font-size: 11px;
      letter-spacing: 0.02em;
      line-height: 1.45;
      padding: 7px 11px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      transform: translateX(-50%) translateY(4px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.55);
      z-index: 10;
    }
    .diff-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Mute button ── */
    #mute-btn {
      position: fixed;
      top: 10px; right: 14px;
      background: #1a001a;
      border: 1px solid #bf1eff;
      color: #bf1eff;
      font-size: 16px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 20;
    }
    #mute-btn:hover { background: #3b0764; }
  </style>
</head>
<body>
  <button id="mute-btn" title="Silenciar/Activar">🔊</button>

  <div id="pong-root">
    <div id="pong-header">
      <div class="score-block">
        <div class="score-label">TÚ</div>
        <div class="score-num" id="score-p">0</div>
      </div>
      <div class="score-block">
        <div class="score-label">CPU</div>
        <div class="score-num" id="score-ai">0</div>
      </div>
    </div>

    <div id="difficulty-menu">
      <span class="diff-label">Dificultad</span>
      <button class="diff-btn" id="diff-easy"
        data-tooltip="La CPU comete errores frecuentes y falla golpes. Ideal para principiantes.">
        Fácil
      </button>
      <button class="diff-btn active" id="diff-normal"
        data-tooltip="La CPU falla de vez en cuando. Un reto equilibrado.">
        Normal
      </button>
      <button class="diff-btn" id="diff-hard"
        data-tooltip="La CPU predice la pelota casi perfectamente. ¡Suerte!">
        Difícil
      </button>
    </div>

    <div id="canvas-wrap">
      <canvas id="pong-canvas" width="560" height="340"></canvas>
      <div id="overlay">
        <div id="overlay-text">PONG</div>
        <div id="overlay-sub">Mueve el ratón sobre el campo para empezar</div>
      </div>
    </div>

    <div id="pong-speed-bar">
      <span>Velocidad</span>
      <div id="speed-track"><div id="speed-fill"></div></div>
      <span id="speed-label">1x</span>
    </div>

    <div id="pong-status"></div>
    <button id="restart-btn">Jugar de nuevo</button>
  </div>

  <script>
  (function () {
    const canvas = document.getElementById('pong-canvas');
    const ctx    = canvas.getContext('2d');
    const wrap   = document.getElementById('canvas-wrap');
    const W = canvas.width, H = canvas.height;

    const PAD_W = 10, PAD_H = 64, PAD_MARGIN = 16;
    const BALL_R = 7;
    const WIN_SCORE = 10;
    const SPEED_INTERVAL = 10000;
    const BASE_SPEED = 2;
    const SPEED_INCREMENT = 0.75;
    const TRAIL_MAX = 18;

    let state = 'idle';
    let scoreP = 0, scoreAI = 0;
    let speedMultiplier = 1;
    let speedIntervalId = null;
    let animId = null;

    const diffMaxError = { easy: 110, normal: 42, hard: 6 };
    let currentDiff    = 'normal';
    let aiError        = 0;
    let aiErrorTarget  = 0;
    let aiErrorTimer   = 0;

    function newAiErrorTarget() {
      const max = diffMaxError[currentDiff];
      aiErrorTarget = (Math.random() * 2 - 1) * max;
      const interval = { easy: 28, normal: 55, hard: 90 };
      aiErrorTimer = interval[currentDiff] + Math.floor(Math.random() * 20);
    }

    function tickAiError() {
      aiErrorTimer--;
      if (aiErrorTimer <= 0) newAiErrorTarget();
      const drift = { easy: 0.6, normal: 1.4, hard: 4.5 };
      const d = drift[currentDiff];
      const delta = aiErrorTarget - aiError;
      aiError += Math.max(-d, Math.min(d, delta));
    }

    const diffBtns = {
      easy:   document.getElementById('diff-easy'),
      normal: document.getElementById('diff-normal'),
      hard:   document.getElementById('diff-hard'),
    };

    function setDifficulty(key) {
      currentDiff = key;
      aiError = 0; aiErrorTarget = 0; aiErrorTimer = 0;
      Object.values(diffBtns).forEach(b => b.classList.remove('active'));
      diffBtns[key].classList.add('active');
    }

    diffBtns.easy.addEventListener('click',   () => setDifficulty('easy'));
    diffBtns.normal.addEventListener('click', () => setDifficulty('normal'));
    diffBtns.hard.addEventListener('click',   () => setDifficulty('hard'));

    let padP  = { x: PAD_MARGIN, y: H / 2 - PAD_H / 2 };
    let padAI = { x: W - PAD_MARGIN - PAD_W, y: H / 2 - PAD_H / 2 };
    let ball  = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    let mouseY = H / 2;
    let trail = [];
    let particles = [];

    // ── AUDIO ENGINE ────────────────────────────────────────────
    let audioCtx = null;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;
    let muted = false;
    let musicNodes = [];
    let arpInterval = null;
    let bassInterval = null;
    let arpStep = 0;
    let bassStep = 0;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 1.0;
      masterGain.connect(audioCtx.destination);

      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.15;
      musicGain.connect(masterGain);

      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = 0.55;
      sfxGain.connect(masterGain);

      startMusic();
    }

    function toggleMute() {
      if (!audioCtx) initAudio();
      muted = !muted;
      masterGain.gain.setTargetAtTime(muted ? 0 : 1, audioCtx.currentTime, 0.1);
      document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
    }
    document.getElementById('mute-btn').addEventListener('click', toggleMute);

    // ── MÚSICA AMBIENTAL ─────────────────────────────────────────
    // Estilo synthwave oscuro: pads de acordes + arpeggio + bajo pulsante

    function makePad(freq, gainVal) {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const g    = audioCtx.createGain();
      const filt = audioCtx.createBiquadFilter();
      osc1.type = 'sawtooth'; osc1.frequency.value = freq;
      osc2.type = 'sawtooth'; osc2.frequency.value = freq * 1.005; // leve detune
      filt.type = 'lowpass';  filt.frequency.value = 900; filt.Q.value = 1.2;
      g.gain.value = gainVal;
      // LFO de volumen lento
      const lfo = audioCtx.createOscillator();
      const lfoG = audioCtx.createGain();
      lfo.frequency.value = 0.08 + Math.random() * 0.04;
      lfoG.gain.value = gainVal * 0.5;
      lfo.connect(lfoG); lfoG.connect(g.gain);
      lfo.start();
      osc1.connect(filt); osc2.connect(filt); filt.connect(g); g.connect(musicGain);
      osc1.start(); osc2.start();
      musicNodes.push(osc1, osc2, g, filt, lfo, lfoG);
    }

    // Progresión de acordes estilo synthwave: Am - F - C - G
    // Notas en Hz de cada acorde (raíz, tercera, quinta)
    const CHORD_SEQ = [
      [220.00, 261.63, 329.63], // Am
      [174.61, 220.00, 261.63], // F
      [130.81, 164.81, 196.00], // C
      [196.00, 246.94, 293.66], // G
    ];
    let chordIdx = 0;
    let chordInterval = null;

    function playChord() {
      if (!audioCtx || muted) return;
      const chord = CHORD_SEQ[chordIdx % CHORD_SEQ.length];
      chord.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        const filt = audioCtx.createBiquadFilter();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        filt.type = 'lowpass'; filt.frequency.value = 700;
        const t = audioCtx.currentTime;
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(0.12, t + 0.08);
        env.gain.setValueAtTime(0.12, t + 1.6);
        env.gain.linearRampToValueAtTime(0, t + 2.0);
        osc.connect(filt); filt.connect(env); env.connect(musicGain);
        osc.start(t); osc.stop(t + 2.1);
      });
      chordIdx++;
    }

    // Arpeggio synthwave sobre la progresión
    const ARP_PATTERNS = [
      [0, 2, 4, 2, 0, 4, 2, 0],
      [0, 4, 2, 4, 0, 2, 4, 2],
    ];
    let arpPattern = 0;

    function startArp() {
      arpInterval = setInterval(() => {
        if (!audioCtx || muted) return;
        const chord = CHORD_SEQ[chordIdx % CHORD_SEQ.length];
        const pat   = ARP_PATTERNS[arpPattern % ARP_PATTERNS.length];
        const noteIdx = pat[arpStep % pat.length];
        const freq = chord[noteIdx % chord.length] * 2; // octava alta

        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        const t = audioCtx.currentTime;
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(0.04, t + 0.01);
        env.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(env); env.connect(musicGain);
        osc.start(t); osc.stop(t + 0.25);
        arpStep++;
      }, 150);
    }

    function startBass() {
      bassInterval = setInterval(() => {
        if (!audioCtx || muted) return;
        const chord = CHORD_SEQ[chordIdx % CHORD_SEQ.length];
        const freq  = chord[0] / 2; // sub-octava

        const osc  = audioCtx.createOscillator();
        const env  = audioCtx.createGain();
        const filt = audioCtx.createBiquadFilter();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        filt.type = 'lowpass'; filt.frequency.value = 280;
        const t = audioCtx.currentTime;
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(0.22, t + 0.04);
        env.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        osc.connect(filt); filt.connect(env); env.connect(musicGain);
        osc.start(t); osc.stop(t + 0.6);
        bassStep++;
      }, 600);
    }

    // Hi-hat sutil
    let hihatInterval = null;
    function startHihat() {
      hihatInterval = setInterval(() => {
        if (!audioCtx || muted) return;
        const bufSize = Math.floor(audioCtx.sampleRate * 0.03);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const src  = audioCtx.createBufferSource();
        src.buffer = buf;
        const filt = audioCtx.createBiquadFilter();
        filt.type = 'highpass'; filt.frequency.value = 8000;
        const env = audioCtx.createGain();
        env.gain.setValueAtTime(0.035, audioCtx.currentTime);
        env.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        src.connect(filt); filt.connect(env); env.connect(musicGain);
        src.start(); src.stop(audioCtx.currentTime + 0.04);
      }, 300);
    }

    function startMusic() {
      // Pads de ambiente oscuro
      makePad(55.00, 0.08);  // A1
      makePad(82.41, 0.06);  // E2
      makePad(110.0, 0.05);  // A2

      // Chord stabs cada 2s
      chordInterval = setInterval(playChord, 2000);
      playChord();

      startArp();
      startBass();
      startHihat();
    }

    function stopMusic() {
      if (chordInterval)  clearInterval(chordInterval);
      if (arpInterval)    clearInterval(arpInterval);
      if (bassInterval)   clearInterval(bassInterval);
      if (hihatInterval)  clearInterval(hihatInterval);
      for (const n of musicNodes) {
        try { if (n.stop) n.stop(); n.disconnect(); } catch(e) {}
      }
      musicNodes = [];
    }

    // ── EFECTOS DE SONIDO ────────────────────────────────────────

    // Golpe de paleta: tono corto percusivo, más agudo cuanto más rápido
    function playPaddleHit(isPlayer, speed) {
      if (!audioCtx || muted) return;
      const freq = isPlayer ? 440 : 330;
      const pitchBoost = Math.min(speed / (BASE_SPEED * 3), 1);

      const osc  = audioCtx.createOscillator();
      const env  = audioCtx.createGain();
      const filt = audioCtx.createBiquadFilter();
      osc.type = 'square';
      osc.frequency.value = freq * (1 + pitchBoost * 0.5);
      filt.type = 'bandpass'; filt.frequency.value = freq * 2; filt.Q.value = 3;
      const t = audioCtx.currentTime;
      env.gain.setValueAtTime(0.5, t);
      env.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(filt); filt.connect(env); env.connect(sfxGain);
      osc.start(t); osc.stop(t + 0.14);

      // Click de impacto encima
      const click = audioCtx.createOscillator();
      const cEnv  = audioCtx.createGain();
      click.type = 'sine'; click.frequency.value = freq * 3;
      cEnv.gain.setValueAtTime(0.3, t);
      cEnv.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      click.connect(cEnv); cEnv.connect(sfxGain);
      click.start(t); click.stop(t + 0.06);
    }

    // Rebote en pared: tono grave corto
    function playWallHit() {
      if (!audioCtx || muted) return;
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 160;
      const t = audioCtx.currentTime;
      env.gain.setValueAtTime(0.25, t);
      env.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      osc.connect(env); env.connect(sfxGain);
      osc.start(t); osc.stop(t + 0.1);
    }

    // Punto marcado: fanfarria corta
    function playScore(playerScored) {
      if (!audioCtx || muted) return;
      const notes = playerScored
        ? [523.25, 659.25, 783.99, 1046.50]  // Do mayor ascendente
        : [392.00, 349.23, 311.13, 261.63];  // descendente triste
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        const t = audioCtx.currentTime + i * 0.1;
        osc.type = 'triangle'; osc.frequency.value = freq;
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(0.3, t + 0.02);
        env.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(env); env.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.3);
      });
    }

    // Fin de partida: melodía dramática
    function playGameEnd(playerWon) {
      if (!audioCtx || muted) return;
      const notes = playerWon
        ? [523.25, 659.25, 783.99, 1046.50, 1318.51]
        : [523.25, 493.88, 440.00, 392.00,  349.23];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        const t = audioCtx.currentTime + i * 0.18;
        osc.type = playerWon ? 'triangle' : 'sawtooth';
        osc.frequency.value = freq;
        env.gain.setValueAtTime(0, t);
        env.gain.linearRampToValueAtTime(0.35, t + 0.03);
        env.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        osc.connect(env); env.connect(sfxGain);
        osc.start(t); osc.stop(t + 0.6);
      });
    }

    // Subida de velocidad: sweep ascendente
    function playSpeedUp() {
      if (!audioCtx || muted) return;
      const osc  = audioCtx.createOscillator();
      const env  = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.25);
      env.gain.setValueAtTime(0.2, audioCtx.currentTime);
      env.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(env); env.connect(sfxGain);
      osc.start(); osc.stop(audioCtx.currentTime + 0.32);
    }

    // ── helpers ── 
    function resetBall(dir) {
      ball.x = W / 2; ball.y = H / 2;
      trail = [];
      const angle = (Math.random() * 60 - 30) * Math.PI / 180;
      const speed = BASE_SPEED * speedMultiplier;
      ball.vx = speed * dir;
      ball.vy = speed * Math.sin(angle);
    }

    function updateScoreUI() {
      document.getElementById('score-p').textContent  = scoreP;
      document.getElementById('score-ai').textContent = scoreAI;
    }

    function updateSpeedUI() {
      const t   = (speedMultiplier - 1) / 3;
      const pct = Math.round(t * 80 + 20);
      const fill = document.getElementById('speed-fill');
      fill.style.width = pct + '%';
      const r = Math.round(83  + t * (220 - 83));
      const g = Math.round(74  + t * (60  - 74));
      const b = Math.round(183 + t * (80  - 183));
      fill.style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
      document.getElementById('speed-label').textContent = speedMultiplier.toFixed(1) + 'x';
    }

    function flashStatus(msg) {
      const el = document.getElementById('pong-status');
      el.textContent = msg;
      setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2000);
    }

    function popScore(id) {
      const el = document.getElementById(id);
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 300);
    }

    function spawnPointLabel(scoredByPlayer) {
      const lbl = document.createElement('div');
      lbl.className = 'point-label';
      lbl.textContent = '+1';
      lbl.style.color = scoredByPlayer ? '#bf1eff' : '#ff3c78';
      lbl.style.left  = scoredByPlayer ? (W * 0.18) + 'px' : (W * 0.72) + 'px';
      lbl.style.top   = (H * 0.38) + 'px';
      wrap.appendChild(lbl);
      lbl.addEventListener('animationend', () => lbl.remove());
    }

    function triggerCanvasEffect(scoredByPlayer) {
      canvas.classList.remove('flash-player', 'flash-ai', 'shake');
      void canvas.offsetWidth;
      canvas.classList.add(scoredByPlayer ? 'flash-player' : 'flash-ai', 'shake');
      setTimeout(() => canvas.classList.remove('flash-player', 'flash-ai', 'shake'), 500);
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd   = 2 + Math.random() * 4.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1,
          decay: 0.032 + Math.random() * 0.03,
          r: 2 + Math.random() * 3,
          color
        });
      }
    }

    // ── speed interval ──
    function startSpeedInterval() {
      if (speedIntervalId) clearInterval(speedIntervalId);
      speedIntervalId = setInterval(() => {
        if (state !== 'playing') return;
        speedMultiplier = Math.min(speedMultiplier + SPEED_INCREMENT, 4);
        const spd = BASE_SPEED * speedMultiplier;
        const cur = Math.hypot(ball.vx, ball.vy);
        if (cur > 0.1) { const ratio = spd / cur; ball.vx *= ratio; ball.vy *= ratio; }
        updateSpeedUI();
        flashStatus('¡Velocidad aumentada!');
        playSpeedUp();
      }, SPEED_INTERVAL);
    }

    // ── game flow ──
    function startGame() {
      initAudio();
      scoreP = 0; scoreAI = 0;
      speedMultiplier = 1;
      padP.y  = H / 2 - PAD_H / 2;
      padAI.y = H / 2 - PAD_H / 2;
      particles = []; trail = [];
      updateScoreUI();
      updateSpeedUI();
      document.getElementById('overlay').style.display    = 'none';
      document.getElementById('restart-btn').style.display = 'none';
      document.getElementById('pong-status').textContent   = '';
      startSpeedInterval();
      state = 'playing';
      resetBall(Math.random() < 0.5 ? 1 : -1);
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function onPoint(scoredByPlayer) {
      triggerCanvasEffect(scoredByPlayer);
      spawnPointLabel(scoredByPlayer);
      spawnParticles(
        scoredByPlayer ? W - 30 : 30,
        ball.y,
        scoredByPlayer ? '#bf1eff' : '#ff3c78'
      );
      playScore(scoredByPlayer);
      if (scoredByPlayer) { scoreP++; popScore('score-p'); }
      else                 { scoreAI++; popScore('score-ai'); }
      updateScoreUI();
      speedMultiplier = 1;
      updateSpeedUI();
      startSpeedInterval();
      if (scoreP >= WIN_SCORE || scoreAI >= WIN_SCORE) {
        endGame();
      } else {
        state = 'pause';
        setTimeout(() => {
          if (state === 'pause') { state = 'playing'; resetBall(scoreAI > scoreP ? -1 : 1); }
        }, 900);
      }
    }

    function endGame() {
      state = 'end';
      clearInterval(speedIntervalId);
      const playerWon = scoreP >= WIN_SCORE;
      playGameEnd(playerWon);
      const msg  = playerWon ? '¡Has ganado!' : '¡Has perdido!';
      const sub  = playerWon ? scoreP + ' — ' + scoreAI : scoreAI + ' — ' + scoreP;

      document.getElementById('overlay-text').textContent = msg;
      document.getElementById('overlay-sub').textContent  = sub;
      document.getElementById('overlay').style.display    = 'flex';
      document.getElementById('restart-btn').style.display = 'none';

      let secs = 3;
      const subEl = document.getElementById('overlay-sub');
      subEl.textContent = sub + '  —  Reiniciando en ' + secs + '…';
      const countdown = setInterval(() => {
        secs--;
        if (secs > 0) {
          subEl.textContent = sub + '  —  Reiniciando en ' + secs + '…';
        } else {
          clearInterval(countdown);
          startGame();
        }
      }, 1000);
    }

    // ── physics ──
    let prevBallX = 0;

    function playerMove() {
      padP.y = Math.max(0, Math.min(H - PAD_H, mouseY - PAD_H / 2));
    }

    function aiMove() {
      tickAiError();
      const target = (ball.y + aiError) - PAD_H / 2;
      const diff   = target - padAI.y;
      const maxSpd = 3.2 + speedMultiplier * 0.5;
      padAI.y += Math.max(-maxSpd, Math.min(maxSpd, diff));
      padAI.y  = Math.max(0, Math.min(H - PAD_H, padAI.y));
    }

    function checkPadCollision(pad, isPlayer) {
      if (
        ball.x - BALL_R < pad.x + PAD_W &&
        ball.x + BALL_R > pad.x &&
        ball.y > pad.y &&
        ball.y < pad.y + PAD_H
      ) {
        const rel   = (ball.y - (pad.y + PAD_H / 2)) / (PAD_H / 2);
        const angle = rel * 60 * Math.PI / 180;
        const spd   = Math.min(Math.hypot(ball.vx, ball.vy) * 1.04, BASE_SPEED * speedMultiplier * 2);
        ball.vx = (ball.vx > 0 ? -1 : 1) * spd * Math.cos(angle);
        ball.vy = spd * Math.sin(angle);
        ball.x  = ball.vx > 0 ? pad.x + PAD_W + BALL_R + 1 : pad.x - BALL_R - 1;
        playPaddleHit(isPlayer, spd);
      }
    }

    let wasAboveWall = null;
    function update() {
      if (state !== 'playing') return;
      playerMove();
      aiMove();
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > TRAIL_MAX) trail.shift();

      prevBallX = ball.x;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall hits con sonido
      if (ball.y - BALL_R <= 0) {
        ball.y = BALL_R + 1; ball.vy = Math.abs(ball.vy);
        playWallHit();
      }
      if (ball.y + BALL_R >= H) {
        ball.y = H - BALL_R - 1; ball.vy = -Math.abs(ball.vy);
        playWallHit();
      }

      checkPadCollision(padP, true);
      checkPadCollision(padAI, false);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (ball.x < 0) onPoint(false);
      if (ball.x > W) onPoint(true);
    }

    // ── trail color ──
    function trailColor(idx, len) {
      const t   = idx / len;
      const spd = speedMultiplier;
      if (spd < 1.5) return 'rgba(255,255,255,' + (t * 0.18) + ')';
      if (spd < 2.5) return 'rgba(160,100,255,' + (t * 0.35) + ')';
      if (spd < 3.5) return 'rgba(220,60,255,'  + (t * 0.5)  + ')';
      return 'rgba(255,60,80,' + (t * 0.65) + ')';
    }

    // ── render ──
    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, W, H);

      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
      ctx.setLineDash([]);

      const spd = speedMultiplier;
      const trailActive = spd > 1.1 || Math.hypot(ball.vx, ball.vy) > BASE_SPEED * 1.1;
      if (trailActive && trail.length > 1) {
        const len = trail.length;
        for (let i = 0; i < len; i++) {
          const r = BALL_R * (i / len) * Math.min(1, spd * 0.55);
          if (r < 0.5) continue;
          ctx.beginPath();
          ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2);
          ctx.fillStyle = trailColor(i, len);
          ctx.fill();
        }
        if (trail.length >= 2 && spd >= 2) {
          const t0 = trail[trail.length - 1];
          const grad = ctx.createLinearGradient(t0.x, t0.y, ball.x, ball.y);
          const alpha = Math.min(0.45, (spd - 2) * 0.2);
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(1, 'rgba(255,255,255,' + alpha + ')');
          ctx.beginPath();
          ctx.strokeStyle = grad;
          ctx.lineWidth = BALL_R * 1.6;
          ctx.lineCap = 'round';
          ctx.moveTo(t0.x, t0.y);
          ctx.lineTo(ball.x, ball.y);
          ctx.stroke();
        }
      }

      const glowAlpha = Math.max(0, (spd - 1.5) * 0.22);
      if (glowAlpha > 0) { ctx.shadowColor = '#bf1eff'; ctx.shadowBlur = 12 * glowAlpha * 4; }
      ctx.fillStyle = '#fff';
      ctx.fillRect(padP.x,  padP.y,  PAD_W, PAD_H);
      ctx.fillRect(padAI.x, padAI.y, PAD_W, PAD_H);
      ctx.shadowBlur = 0;

      const ballGlow = Math.max(0, (spd - 1) * 6);
      if (ballGlow > 0) { ctx.shadowColor = spd < 2.5 ? '#bf1eff' : '#ff3c78'; ctx.shadowBlur = ballGlow; }
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.shadowBlur = 0;

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function loop() { update(); draw(); animId = requestAnimationFrame(loop); }

    // ── input ──
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouseY = (e.clientY - rect.top) * (H / rect.height);
      if (state === 'idle') startGame();
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      mouseY = (e.touches[0].clientY - rect.top) * (H / rect.height);
      if (state === 'idle') startGame();
    }, { passive: false });

    document.getElementById('restart-btn').addEventListener('click', startGame);

    draw();
  })();
  </script>
</body>
</html>
